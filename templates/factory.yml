# The factory: a plan flipped to `ready` becomes a pull request.
# Copy into .github/workflows/, adjust the inputs, add the secrets.
# Secrets are passed explicitly (not `secrets: inherit`), so only the ones
# named here — set on the repo, or inherited from the org — ever reach the
# reusable workflow. Pass only the ones your chosen agent needs.
name: Factory
on:
  push:
    paths: ["plans/**"]
permissions:
  contents: write
  pull-requests: write
jobs:
  factory:
    uses: RatulMaharaj/factory/.github/workflows/dispatch.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # if agent: codex
      # MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}       # if agent: muse
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
    with:
      # runner: macos-latest
      # setup: |
      #   corepack enable && pnpm install --frozen-lockfile
      # verify_tools: "Bash(pnpm install:*),Bash(pnpm test:*),Bash(pnpm run:*)"
      agent: claude # claude | codex | muse — who implements
      default_model: opus # e.g. opus / gpt-5.6-luna / muse-spark-1.2; empty = agent default
