# The factory's reviewer, reusable — a second vendor, on purpose (though the
# agent is yours to pick). By default Claude builds the PR and Codex reviews
# it, so the review is independent of the model that wrote the code and the
# two bills don't compete; set `agent` to claude, codex or muse to route the
# review elsewhere. Findings post as a Request-changes review with
# line-anchored comments and one-click suggestion blocks; a clean verdict
# plus green CI squash-merges factory PRs. On-demand reviews (workflow_call
# with a pr input, e.g. from /factory review) post their verdict and stop —
# asking for a review is not asking for a merge.
#
# Honest notes: the gate is advisory, not adversarial — a wrong CLEAN merges
# the PR, moving oversight from "click merge" to "read what merged". And a
# merge performed with GITHUB_TOKEN does not retrigger workflows on the base
# branch (GitHub's recursion guard).
name: Factory Review

on:
  workflow_call:
    inputs:
      pr:
        description: "PR number. Omit when calling from a pull_request event."
        type: number
        required: false
      ci_workflow:
        description: "Name of the caller's CI workflow the merge job waits for"
        type: string
        default: CI
      machine_account:
        description: "Login whose PRs count as factory PRs (besides impl/** heads and the Actions bot)"
        type: string
        default: ""
      agent:
        description: "Which agent reviews: claude (Anthropic), codex (OpenAI) or muse (Meta)"
        type: string
        default: codex
      model:
        description: "Model the review runs on, pinned so the verdict does not drift with the CLI's default. Empty means the agent's pinned default (opus / gpt-5.6-luna / muse-spark-1.2)."
        type: string
        default: ""
      effort:
        description: "Reasoning effort for the review (low|medium|high|xhigh|max). Empty means the CLI's default."
        type: string
        default: ""
      auto_merge:
        description: "Squash-merge a factory PR when the review is clean and CI is green. Off, the verdict still posts and the merge is yours to click."
        type: boolean
        default: true
      auto_revise:
        description: "When the review lands FINDINGS on a factory PR, dispatch one automatic revise run on its branch. One round only: a PR that has already been auto-revised is left for humans or /factory revise."
        type: boolean
        default: false
      revise_agent:
        description: "Agent for the auto-revise run: claude, codex or muse"
        type: string
        default: claude
      revise_model:
        description: "Model for the auto-revise run. Empty means the agent's default."
        type: string
        default: ""
      revise_effort:
        description: "Effort for the auto-revise run"
        type: string
        default: medium
      max_turns:
        description: "Turn budget for the auto-revise run"
        type: number
        default: 250
      runner:
        description: "Runner for the auto-revise run — match the caller's CI so verify can run"
        type: string
        default: ubuntu-latest
      setup:
        description: "Shell to provision the toolchain before the auto-revise run"
        type: string
        default: ""
      verify_tools:
        description: "Extra allowlist entries for verify commands in the auto-revise run (claude agent only)"
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "From `claude setup-token` — needed when agent is claude"
        required: false
      MUSE_API_KEY:
        description: "Meta Model API key — needed when agent is muse"
        required: false
      OPENAI_API_KEY:
        description: >-
          An OpenAI platform API key. The preferred auth: a key does not
          rotate, so nothing goes stale between runs.
        required: false
      CODEX_AUTH_JSON:
        description: >-
          Contents of ~/.codex/auth.json after `codex login`. Fallback when
          no OPENAI_API_KEY is set; rotates on every run, so it needs the
          write-back below (and FACTORY_PAT) to survive.
        required: false
      FACTORY_PAT:
        description: >-
          Optional. With the Secrets read/write permission added, the rotated
          Codex auth is written back to the caller's CODEX_AUTH_JSON secret
          after each review — see the persist step for why.
        required: false

jobs:
  review:
    name: Review the diff (${{ inputs.agent }})
    # Factory PRs review automatically; explicit calls (a pr input) were
    # asked for, so no filter applies to them.
    if: >-
      inputs.pr != '' ||
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'impl/') ||
      github.event.pull_request.user.login == 'github-actions[bot]' ||
      github.event.pull_request.user.login == inputs.machine_account
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One review at a time per repository. Codex rotates its refresh token on
    # every run, and the secret can only hold one line of succession — two
    # reviews refreshing in parallel would each burn the other's token.
    concurrency:
      group: codex-auth-${{ github.repository }}
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: RatulMaharaj/factory
          path: .factory

      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          data=$(gh pr view "$PR" --json baseRefName,headRefName,headRefOid,state)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .baseRefName <<<"$data")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .headRefName <<<"$data")" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headRefOid <<<"$data")" >> "$GITHUB_OUTPUT"
          [ "$(jq -r .state <<<"$data")" = "OPEN" ] || { echo "::error::PR #$PR is not open."; exit 1; }

      - name: Install the reviewer
        env:
          AGENT: ${{ inputs.agent }}
        run: .factory/scripts/run-agent.sh install

      # A re-review that cannot see the earlier rounds re-samples the same diff
      # and surfaces a fresh batch of observations every time — the loop never
      # converges. Hand the reviewer the PR's whole review history so a
      # second round can only add something genuinely new.
      - name: Collect prior review history
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          {
            gh api --paginate "repos/${{ github.repository }}/pulls/$PR/comments" \
              --jq '.[] | "- [inline, \(.user.login)] \(.path):\(.line // .original_line): \(.body)"'
            gh api --paginate "repos/${{ github.repository }}/pulls/$PR/reviews" \
              --jq '.[] | select(.body != "") | "- [review, \(.user.login)] \(.body)"'
            gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
              --jq '.[] | "- [comment, \(.user.login)] \(.body)"'
          } > "$RUNNER_TEMP/history.md" || true
          wc -c "$RUNNER_TEMP/history.md"

      - name: Review
        env:
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          # The shim runs the chosen agent sandbox-off where it has one —
          # the runner is an ephemeral VM discarded after the job.
          PROMPT="You are reviewing a pull request. \
          Review the diff between origin/$BASE and origin/$HEAD (git diff origin/$BASE...origin/$HEAD) for CORRECTNESS BUGS ONLY: \
          logic errors, broken edge cases, regressions, unsafe operations, contract violations with the surrounding code. \
          Read enough of the surrounding files to judge in context. Do not report style, naming, or taste. \
          The bar is merge-blocking: for each finding ask whether you would block this merge over it; if not, leave it out. \
          Only include findings you are confident are real; if you are unsure, leave it out. \
          $RUNNER_TEMP/history.md holds every comment already made on this PR, by reviewers and by the author. \
          Read it first. Do not re-raise anything in it, even reworded or at a new line: a finding already made and \
          answered or deliberately not taken is settled, and repeating it blocks the loop from ever converging. \
          Report only issues that are new — introduced by commits the history does not discuss, or genuinely never raised. \
          If the history covers everything you would have said, that IS a clean review; an empty findings list is a good outcome, not a failure to do the job. \
          Ignore everything under .factory/ — it is tooling, not part of the change. \
          Your final message must be PURE JSON, no fences, no prose around it: \
          {\"summary\": \"one-paragraph overall assessment\", \"findings\": [{\"path\": \"repo/relative/file\", \"line\": 123, \"body\": \"what breaks, with the concrete failing scenario\", \"suggestion\": \"exact replacement for that one line, only when a one-line fix is certain\"}]}. \
          line MUST be a line that appears on the new side of the diff (added or context), because the finding is posted as an inline PR comment there. \
          suggestion is optional and must be a drop-in replacement for exactly that line, matching its indentation. \
          A clean review is {\"summary\": \"...\", \"findings\": []}."
          export PROMPT
          OUT="$RUNNER_TEMP/review.json" .factory/scripts/run-agent.sh review

      # Codex auth rides the ChatGPT subscription, and the subscription's
      # refresh token is single-use: running Codex consumes it and issues a
      # new one, which until now died with the runner while the secret kept
      # the burnt one — the next run then failed with "refresh token was
      # already used". Writing the rotated file back keeps the secret at the
      # head of the chain. Needs FACTORY_PAT to carry the Secrets read/write
      # permission; without the PAT the step says so and skips, and the
      # old failure mode returns. `always()` because the rotation happens
      # when Codex *runs*, whether or not the review then succeeded.
      - name: Persist the rotated Codex auth
        if: always() && inputs.agent == 'codex'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          OLD_AUTH: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # An API key does not rotate; there is nothing to persist.
          [ -n "$OPENAI_API_KEY" ] && exit 0
          [ -f ~/.codex/auth.json ] || exit 0
          new=$(cat ~/.codex/auth.json)
          [ "$new" = "$OLD_AUTH" ] && { echo "auth unchanged"; exit 0; }
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Codex rotated its auth but FACTORY_PAT is not set — the stored CODEX_AUTH_JSON is now stale and the next review will fail to sign in."
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON --repo "${{ github.repository }}" --body "$new" &&
            echo "auth rotated — secret updated" ||
            echo "::warning::Could not write CODEX_AUTH_JSON back (does FACTORY_PAT have the Secrets read/write permission?). The stored auth is now stale."

      - name: Post the review
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8").replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,""));console.log((r.findings??[]).length)}catch{console.log("unparsed")}' "$RUNNER_TEMP/review.json")
          if [ "$n" = "0" ]; then v=CLEAN; else v=FINDINGS; fi
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          node .factory/scripts/post-review.mjs "${{ steps.pr.outputs.pr }}" "$RUNNER_TEMP/review.json"

  merge:
    name: Merge when clean and green
    needs: review
    if: needs.review.outputs.verdict == 'CLEAN' && github.event_name == 'pull_request' && inputs.auto_merge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Not `gh pr checks --watch`: that waits on every check on the head
      # SHA, including this very job — a deadlock. Watch the caller's CI
      # workflow by name instead.
      - name: Wait for CI, then merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.review.outputs.sha }}
        run: |
          for i in $(seq 1 56); do
            state=$(gh run list --commit "$SHA" --workflow "${{ inputs.ci_workflow }}" --json status,conclusion \
              --jq 'if length == 0 then "waiting"
                    elif any(.[]; .status != "completed") then "running"
                    elif all(.[]; .conclusion == "success") then "success"
                    else "failure" end')
            echo "${{ inputs.ci_workflow }} on $SHA: $state"
            case "$state" in
              success) break ;;
              failure) echo "::error::CI failed — not merging."; exit 1 ;;
              *) sleep 30 ;;
            esac
          done
          [ "$state" = "success" ] || { echo "::error::CI did not finish in time."; exit 1; }
          gh pr merge ${{ needs.review.outputs.pr }} --squash --delete-branch

  # One automatic revision, at most. FINDINGS on a factory PR dispatches a
  # revise run on its branch; the marker comment it leaves is the fuse — a
  # later review round that finds it leaves the PR for humans (or an
  # explicit /factory revise, which is unaffected by the fuse). The loop
  # closes only when pushes retrigger review, i.e. when FACTORY_PAT is set:
  # a GITHUB_TOKEN push does not restart workflows, so without the PAT the
  # revised branch just waits for its next event.
  auto-revise:
    name: "Auto-revise PR #${{ needs.review.outputs.pr }}"
    needs: review
    if: >-
      needs.review.outputs.verdict == 'FINDINGS' &&
      github.event_name == 'pull_request' &&
      inputs.auto_revise
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FACTORY_PAT || github.token }}

      - uses: actions/checkout@v4
        with:
          repository: RatulMaharaj/factory
          path: .factory

      # The fuse: has an auto-revision already run on this PR?
      - name: First round only
        id: fuse
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.review.outputs.pr }}
        run: |
          prior=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- factory-auto-revise -->"))] | length')
          if [ "$prior" -gt 0 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "An auto-revision already ran on this PR — leaving the new findings for a human or /factory revise."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set origin/HEAD for the push guard
        if: steps.fuse.outputs.go == 'true'
        run: git remote set-head origin --auto

      - name: Check out the PR branch
        if: steps.fuse.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT || secrets.GITHUB_TOKEN || github.token }}
        run: gh pr checkout ${{ needs.review.outputs.pr }}

      - name: Provision the toolchain
        if: steps.fuse.outputs.go == 'true' && inputs.setup != ''
        run: ${{ inputs.setup }}

      - name: Install the agent
        if: steps.fuse.outputs.go == 'true'
        env:
          AGENT: ${{ inputs.revise_agent }}
        run: .factory/scripts/run-agent.sh install

      - name: Revise the PR
        if: steps.fuse.outputs.go == 'true'
        env:
          AGENT: ${{ inputs.revise_agent }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          GH_TOKEN: ${{ secrets.FACTORY_PAT || secrets.GITHUB_TOKEN || github.token }}
          PROMPT: |
            You are a headless dispatched run: nobody is watching and nothing
            can answer a question, so never ask one. You are on the branch of
            pull request #${{ needs.review.outputs.pr }}, checked out at its
            tip. Your unit of work is the review feedback just posted on that
            PR. Read all of it:
            gh pr view ${{ needs.review.outputs.pr }} --comments, and the
            inline code comments via
            gh api "repos/${{ github.repository }}/pulls/${{ needs.review.outputs.pr }}/comments"
            (paginate if needed). Address every actionable piece of feedback
            with commits on this branch; where comments conflict, the most
            recent wins. A comment that asks a question rather than a change
            gets an answer in your summary, not a code change. If the changes
            diverge from the PR's plan file, update the plan file in this
            branch too — and keep the repository's conventions true to what
            you changed: if the repo uses changesets, update or add one for
            this PR; if docs describe what you touched, fix them in the same
            commits. Verify with the smallest relevant check the repository
            offers before pushing. Then push the branch — the ONLY way you
            may push is:
            .factory/scripts/git-push.sh origin <branch> — plain git push
            will be denied. Never push to the default branch, never merge,
            never close the PR. Finally post one summary comment with
            gh pr comment ${{ needs.review.outputs.pr }} listing what you
            changed per finding and what you deliberately did not (and why).
            The .factory directory is the factory's own tooling: never add,
            commit, or modify anything under it.
        run: |
          git config user.name "factory"
          git config user.email "factory@users.noreply.github.com"
          base_tools="Glob,Grep,LS,Read,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git worktree:*),Bash(git fetch:*),Bash(git checkout:*),Bash(.factory/scripts/git-push.sh:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/*)"
          extra="${{ inputs.verify_tools }}"
          MODEL="${{ inputs.revise_model }}" \
          EFFORT="${{ inputs.revise_effort }}" \
          MAX_TURNS="${{ inputs.max_turns }}" \
          ALLOWED_TOOLS="${base_tools}${extra:+,$extra}" \
          TRANSCRIPT="$RUNNER_TEMP/transcript.jsonl" \
          FACTORY_DIR=.factory \
            .factory/scripts/run-agent.sh run

      # Blow the fuse whether or not the revise run succeeded: a failed
      # attempt retried on every synchronize would loop the same failure.
      - name: Mark the auto-revision spent
        if: always() && steps.fuse.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api -X POST "repos/${{ github.repository }}/issues/${{ needs.review.outputs.pr }}/comments" \
            -f body="Auto-revision dispatched for the review findings ([run]($run_url)). This was the one automatic round — further findings need a human or \`/factory revise\`. <!-- factory-auto-revise -->" || true

      - name: Keep the transcript
        if: always() && steps.fuse.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transcript-auto-revise-${{ needs.review.outputs.pr }}
          path: ${{ runner.temp }}/transcript.jsonl
          retention-days: 14
